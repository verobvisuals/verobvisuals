intro_label: Senior · Portrait · Couples Photography
intro_text: I’m a portrait photographer based in the Northeast Ohio and
  Cleveland area, capturing seniors, couples, friends, and meaningful
  milestones. My photography focuses on natural moments, genuine connections,
  and the little details that make every session unique. I love creating images
  that feel timeless, warm, and authentic, giving people memories they can look
  back on for years to come.
featured_heading: Selected *work*
about_heading: Hi, I'm *Veronica!*
about_text: I’m the photographer behind Verobvisuals, and I love capturing the
  moments you’ll want to relive years from now. From the excitement of senior
  year to the friendships, connections, and little moments that make life
  special, my goal is to create photos that feel genuine, personal, and uniquely
  you. I want you to look back at your photos and feel those memories all over
  again.
